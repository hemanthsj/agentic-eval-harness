[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-eval-harness"
version = "0.1.0"
description = "An LLM-judge harness for comms-compliance evaluation that also validates the judge against labeled ground truth."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hemanth Subramanyam" }]
keywords = ["evals", "llm-judge", "compliance", "comms", "anthropic"]
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
eval-harness = "eval_harness.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
